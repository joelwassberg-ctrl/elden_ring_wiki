<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Main/CSS/contact.css">
    <link rel="stylesheet" href="../Main/CSS/main.css">
    <link rel="icon" href="../Images/Logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Contact us</h1>
    </header>
    <h1 class="heading">Hur kan vi hjälpa dig?</h1>
    <h2 class="heading">Fyll i formuläret nedan så återkommer vi så fort som möjligt!</h2>
    <div class="contact-container">
        <form>
            <p>Problemet är på:</p>
            <label>
                <input type="radio" name="contact" value="dator">Dator
            </label>
        
            <label>
                <input type="radio" name="contact" value="mobil">Mobil
            </label>

            <br>

            <p>Din mailadress:</p>
            <label>
                <input id="mail">
            </label>

            <br>

            <p>Ditt ärende (rubrik):</p>
            <label>
                <input id="subject">
            </label>

            <br>

            <p>Beskriv ditt ärende:</p>
            <label>
                <textarea id="message"></textarea>
            </label>

            <br>

            <label>
                <input type="checkbox" name="termer" value="report">Spara mina uppgifter.
            </label>

            <button id="button">Skicka</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2026 Elden Ring Wiki. All rights reserved.</p>
    </footer>
    <script src="contact.js"></script>
    <script src="/Main/JavaScript/boxes.js"></script>
</body>
</html>
